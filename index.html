<!doctype html>
<html lang="es" data-theme="morning">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f1">
  <meta name="description" content="Lector de noticias RSS con selección de medios, temas y lectura sin distracciones.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Extra Extra">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Extra Extra — Noticias</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a href="#news" class="skip-link">Saltar a las noticias</a>
  <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-menu"><span data-icon="menu"></span></button>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Extra Extra, portada"><img src="favicon.png" alt="" width="34" height="34"><span>Extra Extra</span></a>
    <div id="desktop-tools-host">
      <nav id="tools" class="tools" aria-label="Herramientas">
        <button data-panel="search" aria-label="Buscar noticias" title="Buscar noticias"><span data-icon="search"></span><span class="mobile-tool-label">Buscar</span></button>
        <button id="saved-toggle" aria-label="Ver noticias para leer después" title="Para leer después" aria-pressed="false"><span data-icon="bookmark"></span><span class="mobile-tool-label">Leer después</span><span id="saved-count" class="count"></span></button>
        <button data-panel="sources" title="Elegir medios"><span data-icon="rss"></span><span>Medios</span></button>
        <button data-panel="filters" title="Filtros y presentación"><span data-icon="filter"></span><span>Filtros</span><i id="filter-dot" hidden></i></button>
        <button data-panel="appearance" title="Aspecto y lectura"><span data-icon="type"></span><span>Lectura</span></button>
        <button data-panel="about" aria-label="Acerca de Extra Extra" title="Acerca de Extra Extra"><span data-icon="info"></span><span class="mobile-tool-label">Acerca de</span></button>
        <button id="menu-refresh" class="mobile-refresh" title="Actualizar portada"><span data-icon="refresh"></span><span>Actualizar portada</span></button>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="edition">
      <time id="edition-date"></time>
      <div class="edition-updates"><span class="edition-status"><span data-icon="clock"></span><span id="update-status" role="status">Cargando edición…</span></span><button id="refresh" class="text-button" title="Actualizar portada"><span data-icon="refresh"></span><span>Actualizar portada</span></button></div>
    </div>
    <div class="navigation-strip"><nav id="categories" class="categories" aria-label="Secciones generales"></nav><div class="topic-line"><span class="topic-caption">RADAR</span><div id="topics" class="topics" role="navigation" aria-label="Temas específicos"></div></div></div>
    <section class="desk" aria-label="Noticias">
      <h1 id="section-title" class="sr-only">Portada</h1><span id="story-count" class="sr-only"></span>
      <div id="active-filters" class="active-filters" hidden></div>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="news" class="news mosaic" aria-busy="true" tabindex="-1"><div class="loading-state">Cargando noticias…</div></div>
      <div id="load-sentinel" aria-hidden="true"></div><p id="feed-status" class="sr-only" role="status"></p>
    </section>
  </main>
  <dialog id="mobile-menu" class="mobile-menu" aria-labelledby="mobile-menu-title"><div class="mobile-menu-header"><button id="menu-favicon" aria-label="Cerrar menú"><img src="favicon.png" width="36" height="36" alt=""></button><h2 id="mobile-menu-title">Extra Extra</h2><button id="close-menu" class="icon-button" aria-label="Cerrar menú lateral"><span data-icon="close"></span></button></div><div id="mobile-tools-host"></div><div class="mobile-menu-status" id="mobile-menu-status"></div></dialog>
  <dialog id="panel" class="panel" aria-labelledby="panel-title"><div class="panel-header"><h2 id="panel-title"></h2><button class="icon-button" id="close-panel" aria-label="Cerrar panel"><span data-icon="close"></span></button></div><div id="panel-content"></div></dialog>
  <dialog id="reader" class="reader" aria-label="Leer noticia"><div class="reader-toolbar"><span class="reader-brand">Extra Extra</span><div><button id="reader-pending" class="icon-button" aria-label="Volver a marcar como pendiente" title="Volver a marcar como pendiente"><span data-icon="clock"></span></button><button id="reader-save" class="icon-button" aria-label="Guardar para leer después"><span data-icon="bookmark"></span></button><button id="close-reader" class="icon-button" aria-label="Cerrar lectura"><span data-icon="close"></span></button></div></div><article id="reader-content"></article></dialog>
  <div id="pull-refresh" class="pull-refresh" role="status" hidden><span data-icon="refresh"></span><span id="pull-label">Arrastra para actualizar</span></div>
  <div id="toast" role="status" class="toast" hidden></div>
</body>
</html>
