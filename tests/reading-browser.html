<!doctype html><html lang="es"><meta charset="utf-8"><title>Pruebas de lectura y avisos</title><h1>Pruebas de la cuarta tanda</h1><p>Usa voces y traducciones simuladas: no reproduce sonido, no pide permisos y no envía avisos.</p><button id="run">Ejecutar pruebas</button><pre id="result" role="status"></pre><div id="panel-content"></div><dialog id="reader"><article id="reader-content"></article></dialog><dialog id="image-dialog"><button id="image-zoom">Ampliar</button><button id="close-image">Cerrar fotografía</button><figure id="image-view"></figure></dialog><script type="module">
import {createReaderTools} from '../lib/reader-tools.js';
import {createDailyTools} from '../lib/daily-tools.js';
import {createTranslationEngine} from '../lib/translation.js';
import {sanitizeComfort} from '../lib/reading-tools.js';
import {openFeedDatabase} from '../lib/feeds.js';
const $=s=>document.querySelector(s),assert=(ok,message)=>{if(!ok)throw new Error(message);};
$('#run').onclick=async()=>{
 const lines=[],out=$('#result');let tools;
 try{
  const settings=sanitizeComfort({bilingual:true}),spoken=[],events=[];let index=0;
  const fixture='@reading-fixture-'+crypto.randomUUID(),a={id:fixture,title:'A news headline',content:'The first paragraph.\nThe second paragraph.',summary:'A short excerpt.',language:'en',source:'fixture',url:'https://example.org/'+fixture,image:location.origin+'/favicon.png',imageCaption:'Pie de fotografía',imageCredit:'Autor de prueba',published:new Date().toISOString()};
  const synth={cancel:()=>events.push('cancel'),getVoices:()=>[{voiceURI:'fixture',name:'Prueba',lang:'en-GB',localService:true}],pause:()=>events.push('pause'),resume:()=>events.push('resume'),speak:u=>spoken.push(u)};
  const draw=value=>{$('#reader-content').innerHTML='<h1>'+value.title+'</h1><button data-zoom-image>Ampliar fotografía</button><div id="reader-extensions"></div><div id="article-text" class="reader-text"><p>'+value.content+'</p></div>';tools.attach(value);};
  tools=createReaderTools({settings:()=>settings,persist:()=>{},engine:{prepare:()=>Promise.resolve(null),article:async value=>({title:'Un titular',parts:[{original:'The first paragraph.',translated:'El primer párrafo.'},{original:'The second paragraph.',translated:'El segundo párrafo.'}],target:'es',engine:'local',partial:false}),destroy:()=>{}},synth,Utterance:class{constructor(text){this.text=text;}},source:()=>({name:'Medio de prueba'}),isOpen:()=>$('#reader').open,canNext:()=>index===0,next:()=>{index++;draw({...a,id:fixture+'-next',title:'The next headline',content:'Another paragraph.'});}});
  draw(a);$('#reader').showModal();await tools.translate();assert(document.querySelectorAll('.bilingual-row').length===2,'Dos pares bilingües');assert($('#article-text').textContent.includes('El segundo párrafo.'),'Traducción visible');$('#reader-original').click();assert(!document.querySelector('.bilingual-row')&&$('#article-text').textContent.includes('The first'),'Volver al original');lines.push('Lectura bilingüe: pares, traducción y vuelta al original correctos.');
  $('#speech-play').click();assert(spoken.length===1&&spoken[0].lang==='en','Voz e idioma originales');$('#speech-pause').click();$('#speech-pause').click();assert(events.includes('pause')&&events.includes('resume'),'Pausa y continuación');const old=spoken.at(-1).onend;$('#speech-stop').click();const count=spoken.length;old();assert(spoken.length===count,'Un final antiguo no reinicia el audio cancelado');lines.push('Audio: idioma, pausa, continuación y cancelación sin reproducción real.');
  settings.audioNext=true;$('#speech-play').click();for(let n=0;n<20&&!index;n++)spoken.at(-1).onend();assert(index===1&&spoken.at(-1).text.includes('next headline'),'Avance automático a la siguiente noticia');$('#speech-stop').click();lines.push('Audio consecutivo: termina una noticia y pasa a la siguiente.');
  document.querySelector('[data-zoom-image]').click();assert($('#image-view').textContent.includes('Autor de prueba'),'Crédito declarado');assert($('#image-view img').alt==='Pie de fotografía','Pie de foto como alternativa');$('#image-zoom').click();assert($('#image-dialog').classList.contains('image-zoomed'),'Ampliar imagen');$('#image-dialog').close();$('#reader').close();tools.detach();lines.push('Fotografía: ampliación, crédito y pie conservados.');
  let state={},items=[a],notices=[];const prefs=sanitizeComfort({alertsEnabled:true,alertQuery:'NASA',quietStart:'00:00',quietEnd:'00:00'}),create=()=>createDailyTools({settings:()=>prefs,read:()=>state,persist:v=>state=structuredClone(v),save:()=>{},articles:()=>items,sources:()=>[],source:()=>({name:'Prueba'}),category:()=> 'Ciencia',followed:()=>false,notify:t=>notices.push(t),date:t=>t,download:()=>{}});
  const daily=create();await daily.check();items.push({...a,id:'new-'+fixture,url:'https://example.org/new-'+fixture,title:'NASA anuncia una misión'});await daily.check();assert(daily.state.pending.length===1&&daily.state.inbox.length===0,'Esperar durante el descanso');prefs.quietEnabled=false;await daily.check();assert(daily.state.pending.length===0&&daily.state.inbox.length===1,'Un grupo al acabar el descanso');items.push({...a,id:'second-'+fixture,url:'https://example.org/second-'+fixture,title:'NASA inicia otro estudio'});await daily.check();assert(daily.state.inbox.length===1&&daily.state.pending.length===1,'Respetar intervalo');state.lastDelivery=Date.now()-16*60000;const resumed=create();await resumed.check();assert(resumed.state.inbox.length===2,'Recuperar pendientes y entregar al vencer el intervalo');lines.push('Avisos: descanso, agrupación, intervalo y recuperación sin pedir permisos.');
  let requests=0,usage={};const cfg=sanitizeComfort({engine:'mymemory'}),engine=()=>createTranslationEngine({settings:()=>cfg,readUsage:()=>usage,saveUsage:v=>usage=v,fetcher:async()=>{requests++;return {ok:true,json:async()=>({responseStatus:200,responseData:{translatedText:'Traducción de prueba'}})};}}),one=engine(),cacheArticle={...a,title:fixture+' title',summary:fixture+' summary'};
  await one.article(cacheArticle,{full:false});assert(requests===2,'Dos segmentos consultados');const two=engine();await two.ready;assert(two.peekCard(cacheArticle)?.title==='Traducción de prueba','Traducción recuperada de IndexedDB');await two.article(cacheArticle,{full:false});assert(requests===2,'No repetir consultas recuperadas');const db=await openFeedDatabase();await new Promise((resolve,reject)=>{const tx=db.transaction('translations','readwrite'),store=tx.objectStore('translations'),get=store.getAll();get.onsuccess=()=>{for(const row of get.result)if(row.original.startsWith(fixture))store.delete(row.id);};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);}).finally(()=>db.close());lines.push('Caché de traducción: persiste, se recupera y evita peticiones repetidas.');
  out.textContent=lines.join('\n')+'\n6 pruebas completadas correctamente.';
 }catch(error){tools?.detach();if($('#reader').open)$('#reader').close();out.textContent=lines.join('\n')+'\nERROR: '+error.message;}
};
</script></html>
